name: One-time obsolete workflow run cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/purge-obsolete-email-run-links.yml
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    if: "startsWith(github.event.head_commit.message, 'chore: purge outdated workflow runs after privacy rewrite')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete two obsolete workflow runs linking to old commits
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for id in 41384582765 41384456575; do
            result="$(curl --silent --show-error --output /tmp/gh-delete-run-response --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}")"
            echo "Delete workflow run ${id}: HTTP ${result}"
            test "${result}" = "204" || { cat /tmp/gh-delete-run-response; exit 1; }
          done
