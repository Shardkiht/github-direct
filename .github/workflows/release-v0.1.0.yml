name: Release v0.1.0

on:
  workflow_dispatch:
  push:
    tags:
      - v0.1.0

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Shardkiht/github-direct'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows PowerShell 5.1 syntax and release package
        shell: powershell
        run: .\tests\parse-and-smoke.ps1
      - name: Package release
        shell: powershell
        run: .\package.ps1
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release v0.1.0 already exists; will not overwrite.' }
          gh release create v0.1.0 dist/GitHubDirect-v0.1.0.zip --target $env:GITHUB_SHA --title 'v0.1.0' --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
