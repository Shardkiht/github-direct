name: One-time privacy cleanup for obsolete Actions runs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/purge-privacy-workflow-runs.yml
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    if: "startsWith(github.event.head_commit.message, 'chore: remove obsolete privacy cleanup runs')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove old temporary Actions runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for id in 43365929783 43367692404; do
            code="$(curl --silent --show-error --output /tmp/delete-result --write-out '%{http_code}' --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}")"
            echo "Removed obsolete run ${id}: HTTP ${code}"
            test "${code}" = "204" || { cat /tmp/delete-result; exit 1; }
          done
