name: Release v0.1.0

on:
  workflow_dispatch:
  push:
    tags:
      - v0.1.0

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Shardkiht/github-direct'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows PowerShell 5.1 syntax and release package
        shell: powershell
        run: .\tests\parse-and-smoke.ps1
      - name: Package release
        shell: powershell
        run: .\package.ps1
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'Release v0.1.0 already exists; will not overwrite.'
            exit 1
          fi
          gh release create v0.1.0 dist/GitHubDirect-v0.1.0.zip --verify-tag --title 'v0.1.0' --notes-file RELEASE_NOTES.md
